name: Check Ice Skating Availability

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run availability check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PYTHONUNBUFFERED: "1"
        run: python check_courses.py
